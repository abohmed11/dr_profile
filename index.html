    <!-- Prevent Mobile & Tablet Pinch Zooming -->
    <script>
      (function() {
        // Prevent Safari & WebKit gesture zooming (pinch-to-zoom)
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // Prevent multi-touch pinch zooming on mobile & tablet devices
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent Ctrl + Mouse wheel zoom (trackpad / hybrid tablet touchscreens)
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent right-click / context menu on images across the site
        document.addEventListener('contextmenu', function(e) {
          if (e.target && (e.target.tagName === 'IMG' || e.target.closest('img') || e.target.tagName === 'PICTURE' || e.target.getAttribute('data-prevent-save') !== null)) {
            e.preventDefault();
            return false;
          }
        }, false);

        // Prevent dragging images to desktop / folders / browser tabs
        document.addEventListener('dragstart', function(e) {
          if (e.target && (e.target.tagName === 'IMG' || e.target.closest('img') || e.target.tagName === 'PICTURE')) {
            e.preventDefault();
            return false;
          }
        }, false);
      })();
    </script>
